<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slideshow — Clack demo</title>
<script src="/mockups/scheme.js"></script>
<script type="module" src="/dist/clack.js"></script>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<clack-show label="Coastlines">
  <figure id="p01">
    <img src="/photos/01.jpg" width="3635" height="5301" alt="An old car in the snow" loading="lazy">
    <figcaption>An old car in the snow <small>Photo: Kristian Karlsson · CC0</small></figcaption>
  </figure>
  <figure id="p02">
    <img src="/photos/02.jpg" width="3840" height="2560" alt="Low tide under a grey sky" loading="lazy">
    <figcaption>Low tide under a grey sky <small>Photo: Ruxandra Mateiu · CC0</small></figcaption>
  </figure>
  <figure id="p03">
    <img src="/photos/03.jpg" width="3840" height="2550" alt="Ridgeline above the valley" loading="lazy">
    <figcaption>Ridgeline above the valley <small>Photo: Aleksandra Boguslawska · CC0</small></figcaption>
  </figure>
  <figure id="p04">
    <img src="/photos/04.jpg" width="3800" height="2850" alt="Cables of the bridge" loading="lazy">
    <figcaption>Cables of the bridge <small>Photo: Piotr Kwiatkowski · CC0</small></figcaption>
  </figure>
  <figure id="p05">
    <img src="/photos/05.jpg" width="3840" height="2550" alt="Old pier at sunset" loading="lazy">
    <figcaption>Old pier at sunset <small>Photo: Victoria Alexander · CC0</small></figcaption>
  </figure>
  <figure id="p06">
    <img src="/photos/06.jpg" width="3840" height="2561" alt="Houses above the harbour" loading="lazy">
    <figcaption>Houses above the harbour <small>Photo: Jonas Lavoie-Levesque · CC0</small></figcaption>
  </figure>
  <figure id="p07">
    <img src="/photos/07.jpg" width="3840" height="2880" alt="A bale in the morning mist" loading="lazy">
    <figcaption>A bale in the morning mist <small>Photo: Michal Kubíček · CC0</small></figcaption>
  </figure>
  <figure id="p08">
    <img src="/photos/08.jpg" width="3840" height="2550" alt="Pelicans on the jetty" loading="lazy">
    <figcaption>Pelicans on the jetty <small>Photo: Yair Hazout · CC0</small></figcaption>
  </figure>
  <figure id="p09">
    <img src="/photos/09.jpg" width="3840" height="2562" alt="The road to the hill" loading="lazy">
    <figcaption>The road to the hill <small>Photo: Jon Ottosson · CC0</small></figcaption>
  </figure>
  <figure id="p10">
    <img src="/photos/10.jpg" width="3840" height="2560" alt="Cliffs at golden hour" loading="lazy">
    <figcaption>Cliffs at golden hour <small>Photo: Artur Pokusin · CC0</small></figcaption>
  </figure>
</clack-show>
</body>
</html>
