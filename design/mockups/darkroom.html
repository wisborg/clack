<!doctype html>
<html lang="en" data-theme="darkroom">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkroom — Clack mock-up</title>
<script src="scheme.js"></script>
<link rel="stylesheet" href="mockups.css">
</head>
<body>
<div class="show" role="region" aria-roledescription="carousel" aria-label="Coastlines">
  <header class="show-header"><span class="album">Coastlines</span><span>Summer 2014 · 24 photos</span></header>
  <div class="stage" aria-roledescription="slide" aria-label="6 of 24"><img class="photo" src="/photos/06.jpg" width="3840" height="2561" alt="Houses above the harbour"></div>
  <div class="below">
    <p class="caption"><span class="title">Houses above the harbour</span><span class="credit">Photo: Jonas Lavoie-Levesque · CC0</span></p>
    <div class="controls">
      <button type="button" aria-label="Previous photo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="counter">6 / 24</span>
      <button type="button" aria-label="Next photo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="tools">
      <button type="button" aria-label="Pause the slideshow"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
      <button type="button" aria-label="About this photo" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
      <button type="button" aria-label="Full screen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><span></span></div>
</div>
</body>
</html>
